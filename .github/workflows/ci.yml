name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Test
        run: make cover
      - name: Integration tests
        run: make integration
        env:
          # The one test that installs (and removes) GNU hello runs on macOS only (spec I1-14).
          FACMAN_INTEGRATION_MUTATE: ${{ runner.os == 'macOS' && '1' || '' }}
      - name: Build
        run: make build
      - name: Smoke test
        run: bin/facman --version
